<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenMainty — 유지보수 관제센터</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* 디자인 토큰: 이 파일의 색·간격·서체는 아래 변수만 사용.
   기본은 차분한 라이트(엷은 세이지 바탕·진한 서체·자주 결단 강조)다.
   OS 다크모드가 예전 다크를 강제하지 않는다: 다크는 사용자가
   html[data-theme="dark"] 로 명시 선택할 때만 적용된다. */
:root {
  color-scheme: light;
  --bg: #edf0e8; --panel: #f8faf5; --side: #f4f6f0;
  --ink: #1e231b; --ink2: #3f463a; --ink3: #5a6152;
  --hair: #1e231b14; --hair2: #1e231b2e; --bubble: #5b21c60a;
  --accent: #5b21c6; --accent-ink: #ffffff; --accent-soft: #5b21c614;
  --accent-line: #5b21c640; --accent-bright: #7a3ff0;
  --ok: #17703a; --warn: #8a5f00; --bad: #cf222e; --run: #5b21c6;
  /* 작은 의미 텍스트용 잉크: 종이·패널·선택행 합성면 모두에서
     4.5:1 이상을 만족하는 진한 톤. */
  --ok-ink: #17703a; --warn-ink: #7a5200;
  --bad-ink: #cf222e; --run-ink: #5b21c6;
  --scroll: #8a917f;
  --focus: #5b21c6;
  --r: 14px; --r-lg: 14px; --r-md: 10px; --r-pill: 999px; --gap: 14px;
  --font: -apple-system, "Segoe UI", system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --shadow: 0 8px 28px #1e231b14;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161a; --panel: #1d2025; --side: #181b1f;
  --ink: #e9ebe4; --ink2: #b3b8ab; --ink3: #9aa093;
  --hair: #ffffff17; --hair2: #ffffff2b; --bubble: #ffffff0c;
  --accent: #c9a8fa; --accent-ink: #14161a; --accent-soft: #c9a8fa1f;
  --accent-line: #c9a8fa3d;
  --ok: #3fb950; --warn: #d29922; --bad: #f85149; --run: #c9a8fa;
  --ok-ink: var(--ok); --warn-ink: var(--warn);
  --bad-ink: var(--bad); --run-ink: var(--run);
  --scroll: #6b7263;
  --focus: var(--accent);
  --shadow: 0 10px 36px #00000045;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html, body { overflow-x: hidden; }
#view { overflow-x: hidden; }
.col { min-width: 0; }
.twrap { overflow-x: auto; margin: 0 -2px; padding: 0 2px; }
/* 상태바가 흐름 안으로 들어오면서 고정 띄움 여백은 더 쓰지 않는다.
   has-sb 표시는 살려 두되(동작 바꾸지 않음) 시각 효과는 띠 자체가 진다. */
/* 상태바가 흐름 안 한 줄 띠가 되면서 입력창 들어올림은 더 쓰지 않는다. */
body { font-family: var(--font); margin: 0; font-size: 14px; line-height: 1.6;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: #5b21c635; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #88888850; border-radius: var(--r-md);
  border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible,
select:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 0; z-index: 100;
  background: var(--accent); color: var(--accent-ink); padding: 12px 16px;
  border-radius: 0 0 8px 0; font-weight: 700; text-decoration: none; }
.skip:focus { left: 0; }
.app { display: flex; height: 100vh; }
/* 좌측 고정 내비: 4개 1차 화면 + 저장소 목록 */
.side { width: var(--side-w, 248px); flex-shrink: 0; border-right: 1px solid var(--hair);
  display: flex; flex-direction: column; padding: 14px 12px; gap: 2px;
  background: var(--side); position: relative;
  transition: transform .18s ease, margin-left .18s ease, visibility .18s ease; }
/* 닫힌 사이드바는 키보드·스크린리더 순서에서도 빠진다: 화면 밖으로만
   민 상태(translateX/margin)로는 Tab이 끝까지 들어가기 때문이다.
   visibility 전환은 닫힐 때 끝에서, 열릴 때 시작에서 바뀌어 끊김이 없다. */
body.side-hidden .side { margin-left: calc(-1 * var(--side-w, 248px));
  visibility: hidden; }
.side-resize { position: absolute; top: 0; bottom: 0; right: -5px; width: 10px;
  cursor: col-resize; z-index: 5; }
/* 모바일 오버레이: 데스크톱에서 유지된 너비(var --side-w, 최대 420px
   그대로 보존·리셋 없음)를 뷰포트 안에 가둔다. 항상 56px 해제 띠를
   남겨 닫기 버튼·바깥 탭·Escape 중 하나로 닫을 수 있다. */
.sideclose { display: none; }
.sidebackdrop { position: fixed; inset: 0; z-index: 15;
  background: rgba(0, 0, 0, .32); }
@media (max-width: 820px) {
  .side { position: fixed; z-index: 20; height: 100vh; left: 0; top: 0;
    width: min(var(--side-w, 248px), calc(100vw - 56px));
    transform: translateX(-100%); visibility: hidden; }
  .side.open { transform: none; box-shadow: var(--shadow);
    visibility: visible; }
  /* 데스크톱에서 접은 채로 좁아져도 모바일 서랍은 열리면 보인다. */
  body.side-hidden .side.open { margin-left: 0; visibility: visible; }
  .side-resize { display: none; }
  body.side-hidden .side { margin-left: 0; }
  .sideclose { display: inline-flex; margin-left: auto; }
}
/* 390px: 검토 조작 버튼 탭 타깃 40px 이상, 상태 지표는 간결하게.
   데스크톱 밀도는 그대로 둔다. */
@media (max-width: 480px) {
  /* NOTE: 모바일 컴포넌트 실효 규칙은 기본 규칙 뒤쪽(아래 별도 블록)에 둔다.
     여기(이른 블록)에 두면 뒤쪽 기본 규칙이 같은 명시도로 덮어 무효가 된다. */
  #prep-batch { min-height: 44px; font-size: 13px; max-width: 100%; }
  .card { padding: 12px; }
  .card h2 { font-size: 14px; }
  .qitem { padding: 8px 0; }
  .statline { display: flex; flex-wrap: wrap; gap: 6px; }
  pre.mono { font-size: 12px; max-height: 240px; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 12px; }
.word { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.word span { color: var(--accent); }
.navlink { display: flex; align-items: center; gap: 9px; border: 0; background: none;
  color: inherit; cursor: pointer; font-size: 13px; font-weight: 600;
  padding: 9px 10px; border-radius: var(--r-md); width: 100%; min-height: 44px; text-align: left; }
.navlink:hover { background: #8888881a; }
.navlink.active { background: var(--accent-soft); color: var(--ink); }
.navlink .cnt { margin-left: auto; font-family: var(--mono); font-size: 12px;
  color: var(--ink2); font-weight: 400; }
.navlink .cnt.hot { color: var(--warn-ink); font-weight: 700; }
.side-sec { font-size: 12px; font-weight: 700; letter-spacing: .02em;
  color: var(--ink3); margin: 14px 10px 4px; }
.sideitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; border-radius: var(--r-md); padding: 8px 10px; background: none; color: inherit;
  cursor: pointer; font-size: 13px; min-width: 0; min-height: 44px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sideitem:hover { background: #8888881a; }
.sideitem.active { background: #88888830; }
.sideitem .nm { overflow: hidden; text-overflow: ellipsis; }
.sideitem .ago { color: var(--ink3); font-size: 12px; margin-left: auto; flex-shrink: 0; }
/* 대화 바로가기만: 제목이 먼저 두 줄까지 보이고 부기는 다음 줄로.
   repo 목록 한 줄 표기는 그대로 둔다. */
#chatlist .sideitem { flex-direction: column; align-items: stretch; gap: 1px;
  justify-content: center; min-height: 44px; white-space: normal; }
#chatlist .sideitem .nm { white-space: normal; overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
#chatlist .sideitem .ago { margin-left: 0; }
#repolist { list-style: none; margin: 0; padding: 0; display: flex;
  flex-direction: column; gap: 2px; }
#repolist li { margin: 0; padding: 0; min-width: 0; }
#repolist .sideitem { white-space: nowrap; }
.grow { flex: 1; overflow-y: auto; min-height: 0; }
.side-foot { border-top: 1px solid var(--hair); padding-top: 8px; margin-top: 8px; }
.side-hint { font-size: 12px; color: var(--ink3); padding: 2px 10px 6px; line-height: 1.5; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok); flex-shrink: 0; }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.run { background: var(--run); }
@media (prefers-reduced-motion: no-preference) {
  .dot.run, .dot.warn { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
}
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bar { display: flex; align-items: center; gap: 10px; padding: 11px 20px;
  border-bottom: 1px solid var(--hair); }
.bartitle { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.005em; }
.netdot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  color: var(--ink2); white-space: nowrap; }
.pillbox { font-size: 12px; color: var(--ink2); white-space: nowrap;
  flex-shrink: 0; font-family: var(--mono); }
.pillbox b { color: var(--accent); font-weight: 700; }
/* 모델 상태 알약은 설정으로 가는 실제 버튼이다: 44px 조작 영역,
   키보드 Enter·Space는 네이티브로 동작한다. 톤은 요청된 모드일
   뿐 실제 워커 연결·인증을 보증하지 않는다. */
#modelpill { font: inherit; background: none; border: 1px solid transparent;
  border-radius: var(--r-md); min-height: 44px; min-width: 44px; padding: 6px 10px;
  cursor: pointer; white-space: normal; text-align: center; }
#modelpill[data-tone="unknown"] { color: var(--ink3); }
#modelpill[data-tone="unknown"] b { color: inherit; }
#modelpill:hover { background: #8888881a; }
.iconbtn { border: 0; background: none; color: inherit; cursor: pointer;
  font-size: 16px; padding: 5px 9px; border-radius: var(--r-md);
  box-sizing: border-box; min-height: 44px; min-width: 44px; }
.iconbtn:hover { background: #8888881a; }
/* 스티키 머리글+띠 가림 방지: #view가 스크롤 영역이라
   scrollIntoView·포커스 목표가 머리글 아래에 완전히 보이도록
   위쪽 채움을 머리글+띠 높이(1280/390 실측)에 맞춘다. */
#view { flex: 1; overflow-y: auto; container-type: size;
  scroll-padding-top: 108px; }
/* 작업 영역 안쪽 여백: 아래쪽은 24px로 둔다. 고정 띄움(상태바)이
   사라지면서 끝부분 96px 빈칸은 더 이상 필요 없고, 큰 끝 여백은
   sticky 검사기를 부모 끝 경계에 묶어 작업대 위로 밀어 올린다. */
.col { max-width: 1040px; margin: 0 auto; padding: 24px 24px 24px; }
.col.narrow { max-width: 768px; }
.pagehead { margin: 0 0 12px; }
.pagehead h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.pagehead .sub { font-size: 13px; color: var(--ink2); margin-top: 2px; }
/* 카드·버튼·칩: 한 화면 버튼은 행당 2개 이하 */
.card { border: 1px solid var(--hair); border-radius: var(--r); padding: 16px;
  margin-bottom: var(--gap); background: var(--panel); }
.card h2 { margin: 0 0 8px; font-size: 14px; font-weight: 650; letter-spacing: -0.005em; }
/* 상태 띠 verdict 문장이 띠 안에서 가장 크다(19px/700): 판정 한 문장이
   저장소 이름·라벨보다 먼저 읽힌다. 라벨 h2는 접근성 머리글로 두되
   시각 경쟁을 피한다. 색·토큰 추가 없이 기존 크기/두께만 쓴다. */
[data-band="1"] .band-verdict { font-size: 19px; font-weight: 700; }
/* 미확인 띠만 본문 크기로 낮춘다: 판정이 아니라 알림이므로
   큰 제목처럼 보이지 않게 한다. 실제 판정(ok·주의·막힘)은
   기본 19px/700을 그대로 쓴다. */
[data-band="1"] .band-verdict.is-unknown { font-size: 14px; font-weight: 600; }
[data-band="1"] > h2 { font-size: 13px; font-weight: 600; }
.card h2 .cap { display: block; font-size: 12px; font-weight: 700;
  letter-spacing: .02em; color: var(--ink3); margin-bottom: 4px; }
.muted { color: var(--ink2); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
.card, .ev, .qcard, .txt, .qtext, .provnote, details { min-width: 0; overflow-wrap: anywhere; }
pre.code { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
pre.code code { overflow-wrap: anywhere; word-break: break-word; }
.qrow { flex-wrap: wrap; }
.qrow input, .qrow select, select, input[type="text"], textarea { max-width: 100%; }
table { max-width: 100%; }
.pathline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 단추 체계: .hot 기본(단색) · .btn 보조(엷은 채움) ·
   .quiet 조용(글자형) · .danger 위험. 한 영역에 기본은 하나만. */
.btn { font-size: 13px; padding: 8px 16px; border-radius: var(--r-md);
  cursor: pointer; border: 1px solid transparent;
  background: #88888816; color: inherit;
  white-space: nowrap; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { background: #88888816; }
.btn.hot { background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 600; }
.btn.hot:hover { opacity: .88; }
.btn.quiet { background: none; border-color: transparent; }
.btn.quiet:hover { background: #88888816; }
.btn.danger { color: var(--bad-ink); border-color: #f8514960; }
.btn.danger.armed { background: var(--bad-ink); border-color: var(--bad-ink); color: #fff; }
.btn.sm { font-size: 13px; padding: 6px 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
/* G9b: 띠 안의 동작 버튼은 모든 너비에서 44px 타깃을 둔다. */
[data-band="1"] .btn { min-height: 44px; display: inline-flex; align-items: center; }
/* 증거 버튼: 사람용 라벨이 먼저, 긴 파일명은 부기·툴팁으로. 390px에서도
   버튼이 본문을 밀어내지 않게 감싼다. */
#view .btnrow .btn.evbtn { max-width: 100%; white-space: normal; overflow-wrap: anywhere;
  word-break: break-word; text-align: left; }
#view .btnrow .btn.evbtn .fn { display: block; font-size: 12px; opacity: .65;
  font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
.iconmenu { position: relative; display: inline-block; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 170px;
  background: var(--side); border: 1px solid var(--hair2); border-radius: var(--r-md);
  box-shadow: var(--shadow); padding: 4px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none;
  color: inherit; cursor: pointer; font-size: 13px; padding: 8px 10px; border-radius: 7px; }
.menu button:hover { background: #8888881c; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;
  padding: 3px 10px 3px 8px; margin: 1px 3px 1px 0; white-space: nowrap; min-height: 24px; line-height: 1.5;
  border: 1px solid var(--hair); border-radius: var(--r-pill); color: var(--ink2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0; }
.done { color: var(--ok-ink); } .failed { color: var(--bad-ink); }
.blocked, .cancelled { color: var(--warn-ink); } .pending { opacity: .75; }
.watch { color: var(--warn-ink); }
.running { color: var(--run-ink); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--hair);
  vertical-align: top; }
th { font-weight: 600; color: var(--ink3); font-size: 12px; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: #8888880d; }
/* 실행 기록 행의 상세 링크: 행 전체가 클릭 대상이지만 링크 자체도
   44px 이상이라 터치 목표 크기를 만족한다. 열 순서·읽기 순서는 그대로 둔다. */
tr.rowlink td a[data-work] { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 24px; }
/* 실행 기록 행의 실행 id 링크: 읽기 순서를 바꾸지 않고 24px 눌림 영역을 준다. */
tr.rowlink td a[data-run] { display: inline-flex; align-items: center; min-height: 24px; }
/* 실행 기록 필터: 상태 칩 + 저장소 고르기 + 최신만. 한 줄 행으로
   스크롤하고, 고른 칩은 데스크 고르기 줄과 같은 표시를 쓴다. */
.runs-filter { display: flex; flex-wrap: nowrap; gap: 8px; padding: 10px 0 4px;
  overflow-x: auto; align-items: center; }
.runs-chips { display: flex; flex-wrap: nowrap; gap: 8px; }
/* 칩 단추는 inline-flex라 라벨·개수 사이 공백이 접힌다: 간격으로 띈다. */
.runs-chips .btn { gap: 6px; }
.runs-filter .btn { flex-shrink: 0; }
.runs-filter .btn[aria-pressed="true"] { background: var(--bubble);
  box-shadow: inset 0 0 0 1px var(--accent-line); font-weight: 700; }
.runs-repo { display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink2); flex-shrink: 0; }
/* 저장소 고르기: 그래프 필터 select와 같은 토큰(둥근 모서리·가는
   테두리·투명 바탕). 전역 select:focus-visible이 초점 고리를 진다. */
.runs-filter select { min-height: 44px; font-size: 13px; max-width: 220px;
  padding: 6px 10px; border-radius: var(--r-md);
  border: 1px solid var(--hair2); background: none; color: inherit; }

/* 작업 인스펙터: 6섹션 서사 */
.insp { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr); }
/* 그리드 칸(섹션)이 긴 내용의 최소폭에 밀려 뷰포트를 넘지 않게 가둔다.
   390px에서 카드가 화면 밖으로 삐져나오던 원인이 이것이다. */
.insp > section { min-width: 0; max-width: 100%; }
.pagehead { min-width: 0; }
.pagehead h1 { overflow-wrap: anywhere; }
.insp section { border: 1px solid var(--hair); border-radius: var(--r);
  padding: 16px; background: var(--panel); }
.insp section h2 { margin: 0 0 6px; font-size: 14px; font-weight: 650; }
.insp section h2 .num { display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700; margin-right: 7px;
  vertical-align: 1px; }
.ev { border-top: 1px solid var(--hair); padding: 7px 0; font-size: 14px; line-height: 1.65; }
.ev:first-child { border-top: 0; }
.ev .t { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
/* 공유 증거 링크: 실제 <a href> 의미를 그대로 두고 칩 형태로 읽기·탭하기
   쉽게 한다. 기술 ID·SHA는 title·작은 글씨로만 둔다. */
.evlinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
a.evlink { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 4px 12px; border: 1px solid var(--hair2); border-radius: var(--r-md);
  color: var(--accent); font-size: 13px; line-height: 1.5; text-underline-offset: 3px; }
/* 긴 한글 주제는 낱자 쪼개기 대신 어절 단위로 감는다. ID·SHA는 .mono 보조로만 둔다. */
.card h1, .card h2, .qitem b { word-break: keep-all; overflow-wrap: break-word; }
/* 커뮤니티 행: 강한 제목 + 별도 메타 줄, 날짜+KST는 한 덩이로 감싼다. */
.discrow .discmeta { display: block; margin-top: 3px; }
.nowrap { white-space: nowrap; }
/* 커뮤니티 분석 계층: 요약·근거 소제목은 본문과 구분되게. */
h4.disctitle { font-size: 13px; font-weight: 700; margin: 10px 0 2px; }
/* 보고서 머리: 상태+부분 배지, 한 줄 분류. */
.rep-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0 2px; }
/* 확인된 내용: 줄 간격 있는 목록. */
.findings .findings-line { line-height: 1.65; margin: 3px 0; }
/* 범위 타일: 요청·전달·인용·제외 4칸(모바일 2칸). */
.scope-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0; padding: 0; list-style: none; }
.scope-tile { border: 1px solid var(--hair2); border-radius: var(--r-md); padding: 8px 6px; font-size: 13px; background: var(--panel); text-align: center; }
/* 근거 카드: 파일명+상태 머리, 해시·바이트는 펼침 안. */
.srccard { border: 1px solid var(--hair2); border-radius: var(--r-md); padding: 8px 10px; margin: 8px 0; }
.srccard-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.srccard-h b { overflow-wrap: anywhere; }
.srccard details { margin-top: 4px; }
@media (max-width: 480px) { .scope-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 근거 파일 고르기: 체크박스 행도 44px 탭 타깃(모바일). */
label.srcpick { display: block; margin: 4px 0; font-size: 13px; }
/* 근거 탐색: 폴더 이동 입력+브레드크럼+이름 찾기, 기존 토큰 재사용. */
.evnav { display: grid; gap: 8px; margin: 8px 0; }
input.evgo, input.evfilter { min-height: 44px; width: 100%; box-sizing: border-box; padding: 10px 12px; }
/* 빵조각 분리자가 버튼과 떨어져 외톨이 줄이 되지 않게 한 묶음으로 둔다.
   긴 폴더명은 버튼 안에서 감싼다(카드 밖으로 안 삐져나감). */
.evcrumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.evcrumb { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.evcrumb .btn.sm { max-width: 100%; overflow-wrap: anywhere; word-break: keep-all; white-space: normal; text-align: left; }
/* 선택 파일 행 목록: 전체 경로 본문, 크기 부기, 44px 빼기. */
.evsellist { list-style: none; margin: 6px 0; padding: 0; }
li.evselrow { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
.evselpath { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; word-break: keep-all; }
/* 크기 단위(15B)는 한 덩어리로 둔다. */
li.evselrow .muted.small, label.srcpick .muted.small { white-space: nowrap; }
button.evrm { min-height: 44px; flex-shrink: 0; }
/* 회신 초안: 앱 컨트롤과 coherent한 읽기전용 다크 필드. */
textarea.dscf-ro { width: 100%; box-sizing: border-box; background: var(--panel); color: inherit;
  border: 1px solid var(--hair2); border-radius: var(--r-md); padding: 10px 12px;
  font: inherit; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
@media (max-width: 480px) {
  label.srcpick { box-sizing: border-box; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 0; }
  label.srcpick input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .qcard .qrow #w-answer, .qcard .qrow #answerinput { flex: 1 1 100%; }
}
/* 커뮤니티 필터: 앱의 다른 필터와 같은 coherent select (gfilters 계열). */
select.dscf { font-size: 13px; padding: 7px 10px; border-radius: var(--r-md);
  border: 1px solid var(--hair2); background: var(--panel); color: inherit;
  max-width: 100%; min-height: 40px; vertical-align: middle; }
/* ---- 작업대(workbench) 공용 부품: 토큰은 기존 테마 변수를 그대로
   써서 라이트/다크가 함께 바뀐다. 새 이름은 w* 로만 둔다. ---- */
.wbtn { min-height: 44px; padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid transparent; background: #88888816; color: var(--ink);
  font: inherit; font-size: 13px; cursor: pointer; }
.wbtn.primary { background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 650; }
.wbtn.danger { color: var(--bad-ink); border-color: var(--bad-ink); background: none; }
.wbtn.quiet { border-color: transparent; }
.wbtn:disabled { opacity: .5; cursor: default; }
/* 상태 배지: 의미는 텍스트로 전달하고 색은 보조로만 쓴다. */
.wbadge { display: inline-block; font-size: 12px; border: 1px solid var(--hair2);
  border-radius: var(--r-pill); padding: 1px 9px; white-space: nowrap; }
.wbadge.b-ok { color: var(--ok-ink); border-color: var(--ok-ink); }
.wbadge.b-warn { color: var(--warn-ink); border-color: var(--warn-ink); }
.wbadge.b-bad { color: var(--bad-ink); border-color: var(--bad-ink); }
.wbadge.b-run { color: var(--run-ink); border-color: var(--run-ink); }
.wbadge.b-prop { color: var(--accent); border-color: var(--accent-line); }
/* 도구 모음: 라벨+select+버튼 한 줄, 좁으면 감긴다. */
.wtoolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 도구 모음 안의 들판: 작은 라벨 + 같은 높이의 select. */
.wfield { display: inline-flex; gap: 6px; align-items: center;
  font-size: 13px; color: var(--ink2); min-height: 44px; }
.wfield select { min-height: 44px; }
/* 커뮤니티 머리: 한 줄 요약 + 도구 모음 + 접힌 내막. 작업대가
   첫 화면에 들어오게 여백을 얇게 둔다. */
.wcomhead { padding: 12px 14px; }
.wcomhead h2 { margin-bottom: 8px; }
.wcomhead .wsec { margin-top: 4px; }
/* 좁은 화면 필터: 잘라 넘기지 않고 감는다. 선택 중에는 머리 카드
   자체가 접히므로(아래 .is-sel) 목록 방식에서 전부가 보인다. */
@media (max-width: 700px) {
  .wtoolbar.wfilters { flex-wrap: wrap; }
}
/* 선택 중 좁은 화면: 분류·필터 머리 카드는 독자의 몫이 아니다.
   목록으로 돌아가면(선택 해제) 다시 보인다. */
@media (max-width: 700px) {
  .wcomhead.is-sel { display: none; }
  /* 긴 원문·코드 발췌를 읽어도 뒤로·제목이 멀어지지 않게
     뒤로 줄을 화면 위에 붙인다. */
  .wbackrow { position: sticky; top: 0; z-index: 5;
    background: var(--panel); margin: -4px -14px 0; padding: 8px 14px; }
}
/* 보조 구역 접기: 동기화 내막·기술 기록처럼 2차 정보를 둔다. */
.wsec { margin-top: 8px; }
.wsec > summary { cursor: pointer; min-height: 44px; display: inline-flex;
  align-items: center; }
/* 조용한 상태 띠: 필터 가림·부분 보관 같은 현재 맥락을 한 줄로. */
.wstate { margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--hair2);
  border-radius: var(--r-md); color: var(--ink2); font-size: 13px; }
/* 큐: 네이티브 목록 + 버튼 행. 제목은 두 줄·가변 높이, 48px 이상. */
.wqueue { list-style: none; margin: 0; padding: 0; display: flex;
  flex-direction: column; gap: 6px; }
.wrow { display: block; width: 100%; box-sizing: border-box; text-align: left;
  min-height: 48px; padding: 8px 10px 8px 12px; border: 1px solid transparent;
  border-left: 3px solid transparent; border-radius: var(--r-md); background: none;
  color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
.wrow:hover { background: var(--bubble); }
.wrow[aria-current="true"] { border-color: var(--hair2);
  border-left-color: var(--accent); background: var(--accent-soft); }
/* 큐 행: 제목이 먼저 한 줄(필요하면 감기), 상태·수치는 둘째 줄에.
   제목이 상태 배지와 나란히 눌리지 않게 쌓는다. */
.wrow-t { display: block; }
.wrow-t b { display: block; font-weight: 650; font-size: 13px;
  line-height: 1.5; overflow-wrap: break-word; word-break: keep-all; }
.wrow-meta { display: block; color: var(--ink2); font-size: 12px; margin-top: 3px;
  line-height: 1.7; }
.wrow-meta .wbadge { margin-right: 4px; }
/* 작업대 배치: 데스크톱 큐+검사기, 좁은 화면 한 열. 검사기는
   데스크톱에서 화면에 붙어 스스로 스크롤한다: 긴 코드 발췌를 읽어도
   큐·뒤로가 멀어지지 않고, 폴 다시그리기가 독자 위치를 날리지 않게
   스크롤은 JS가 보관·복원한다. */
.wbench { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
  gap: 12px; align-items: start; }
.winspect { min-width: 0; border: 1px solid var(--hair); border-radius: var(--r-lg);
  padding: 12px 14px; background: var(--panel); }
.winspect > h3 { margin: 2px 0 4px; font-size: 16px; overflow-wrap: break-word;
  word-break: keep-all; }
/* 검사기 표면: 한 구역씩 순서대로. 카드 속 카드가 아니라 여백과
   구역 제목으로 나눈다. */
.wdetail > h3 { margin: 2px 0 6px; font-size: 16px; overflow-wrap: break-word;
  word-break: keep-all; }
.wdetail > details { margin-top: 10px; }
.wdetail .rep-head { margin: 8px 0 4px; }
.wdetail h4.disctitle { margin: 12px 0 4px; font-size: 13px; }
.wback { display: none; }
.wrowli { position: relative; }
.wrowlink { position: absolute; top: 4px; right: 4px; min-width: 44px;
  min-height: 44px; display: inline-flex; align-items: center;
  justify-content: center; border-radius: var(--r-md); color: var(--accent);
  font-size: 14px; }
.wrow { padding-right: 52px; }
/* PR 증거 입력: 블록 라벨 + 전폭 입력. 기본 인라인 21px 텍스트박스와
   달리 44px 터치 타깃과 모바일 16px 글꼴을 보장한다. */
.pr-evfield { display: block; margin-top: 10px; font-size: 13px; color: var(--ink2); }
.pr-evfield input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px;
  min-height: 44px; padding: 10px 12px; font-size: 14px;
  border: 1px solid var(--hair2); border-radius: var(--r-md);
  background: var(--panel); color: var(--ink); }
.pr-evfield input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 480px) { .pr-evfield input { font-size: 16px; } }
/* 막힌 이슈 준비 조사: 원인과 3대5 파일 목록을 먼저, 원시 Git 힌트는
   접힘 뒤에. 준비 선택·준비·조사 동작은 44px 명중 높이를 지킨다. */
#prep-go, #prep-batch, #prep-rec .btn,
#prep-rec-reload, #prep-retry-go, #prep-fu-go { min-height: 44px; }
#prep-batch { font-size: 13px; max-width: 100%; }
#prep-rec .mono { overflow-wrap: anywhere; word-break: break-word; }
#prep-derivedfix .btn, #prep-derivedfix summary { min-height: 44px; }
#prep-derivedfix .mono { overflow-wrap: anywhere; word-break: break-word; }
#prep-derivedfix label.dfix-hyp { min-height: 44px; display: flex; align-items: center; gap: 8px; }
#prep-derivedfix label.dfix-hyp:focus-within { outline: 2px solid currentColor; outline-offset: 2px; }
#prep-rec .rec-files { margin: 4px 0; }
#prep-rec .rec-files .mono { display: block; }
/* PR 펼침 머리: 네이티브 details 키보드를 유지하면서 열림/닫힘을
   알리는 일관된 셰브론. */
#pr-inspector details.adv > summary { list-style: none; }
#pr-inspector details.adv > summary::-webkit-details-marker { display: none; }
#pr-inspector details.adv > summary::before { content: "▸"; color: var(--ink2);
  display: inline-block; width: 1.2em; }
#pr-inspector details.adv[open] > summary::before { content: "▾"; }
@media (min-width: 701px) {
  /* 검사기는 실제 보이는 작업 영역(#view) 안에 들어간다.
     100cqh는 스크롤 포트 #view의 높이이므로, 위쪽 고정 머리·상태띠가
     차지한 뒤 남은 공간에 정확히 맞는다. 24는 sticky 위 여백 12와
     아래 숨쉬기 12이며, cqh 미지원 엔진을 위한 vh 값을 먼저 둔다.
     좁은 화면 단일 열에는 이 제한을 두지 않는다. */
  .winspect { position: sticky; top: 12px; max-height: calc(100vh - 24px);
    max-height: calc(100cqh - 24px); overflow-y: auto; }
}
@media (max-width: 700px) {
  .wbench { grid-template-columns: minmax(0, 1fr); }
  .wbench.has-sel .wqueue-wrap { display: none; }
  .wback { display: inline-block; }
}
/* 저장소 머리: 한 줄 바 + 접기식 보조 동작. */
details.wmenu { display: inline-block; }
details.wmenu > summary { list-style: none; cursor: pointer; }
details.wmenu > summary::-webkit-details-marker { display: none; }
/* 모바일 실효 규칙(기본 규칙 뒤 — 같은 명시도에서 소스 순서로 이긴다).
   390px: 증거 링크·작은 버튼은 44px 탭 타깃으로 쌓는다. 가로 넘침 없음. */
@media (max-width: 480px) {
  .btn.sm { min-height: 44px; padding: 10px 14px; font-size: 13px; }
  .evlinks { gap: 10px; }
  a.evlink { min-height: 44px; padding: 10px 14px; font-size: 14px; max-width: 100%; }
  select.dscf, input[data-disc-by] { min-height: 44px; font-size: 13px; max-width: 100%; }
  /* 커뮤니티 펼침 머리(댓글·분석·시도·기록)도 44px 탭 타깃. */
  #tabbody details > summary { box-sizing: border-box; min-height: 44px; padding-top: 11px; padding-bottom: 11px; line-height: 1.5; }
  /* 저장소 탭(개요·검토·커뮤니티…)도 44px 탭 타깃. */
  .tabs button { min-height: 44px; padding: 11px 18px; font-size: 13px; }
}
/* 390px 헤더: 오른쪽 칩(연결·검색·모델)이 제목을 37px까지 누르지
   못하게, 420px 이하에서는 바를 감아 칩을 아래 줄로 내린다. 제목은
   절반 이상을 차지한 채 말줄임된다(기존 ellipsis 유지). */
@media (max-width: 420px) {
  .bar { flex-wrap: wrap; row-gap: 6px; padding: 10px 12px; }
  .bartitle { flex: 1 1 55%; min-width: 55%; }
}
/* 감시 대상 편집: 공유 칩 한 줄 고정은 유지하되, 이 블록에서만 전체
   이름이 감기고 감시 이름·후보 라벨은 14px로 읽는다. 390px에서 저장·
   확인 버튼·후보 라벨·검색창은 44px 탭 타깃, 데스크톱은 기존
   compact(버튼 기본·라벨 32px·검색창 32px) 유지. */
#watch-edit .qchip { white-space: normal; overflow-wrap: anywhere; max-width: 100%; text-align: left; font-size: 14px; }
#watch-edit .wev { overflow-wrap: anywhere; }
#watch-edit label.wp { font-size: 14px; }
#watch-edit input[type="search"] { width: 100%; max-width: 100%; box-sizing: border-box;
  min-height: 32px; padding: 4px 10px; margin: 6px 0; border-radius: var(--r-md);
  border: 1px solid var(--hair2); background: none; color: inherit; font-size: 13px; }
#watch-edit label.wp { display: flex; gap: 8px; align-items: center; min-height: 32px;
  padding: 4px 0; overflow-wrap: anywhere; }
#watch-edit input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
@media (max-width: 480px) {
  #watch-edit label.wp { min-height: 44px; }
  #watch-edit-save { min-height: 44px; }
  #watch-edit-scan { min-height: 44px; }
  #watch-edit input[type="search"] { min-height: 44px; font-size: 14px; }
}
/* 그래프 */
.glayout { display: flex; gap: var(--gap); align-items: stretch; }
.gmain { flex: 1; min-width: 0; }
.gfilters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; font-size: 13px;
  align-items: center; }
.gfilters select { font-size: 13px; padding: 6px 10px; border-radius: var(--r-md);
  border: 1px solid var(--hair2); background: none; color: inherit; }
.gtools { display: flex; gap: 6px; margin-left: auto; }
.gtools .btn { padding: 5px 11px; }
.gcanvas { position: relative; border: 1px solid var(--hair); border-radius: var(--r);

async function renderCommand() {
  $("bartitle").textContent = "유지보수 관제센터";
  const repos = O.repos || [];
  if (!repos.length) { renderEmpty(); return; }
  /* 이슈별 최신 실행만으로 판단한다. 오래된 실패가 최신 완료를 가리면 안 된다. */
  const latest = latestPerIssue(O.runs || []);
  const latestList = Object.values(latest).sort((a, b) => (b.created_at || "") < (a.created_at || "") ? -1 : 1);
  /* §10 정정: cancelled-superseded-no-change 확정이 있으면 리뷰·이어하기
     결정이 아니다. 스케줄러 큐(로컬 상태, 캐시 우선·없으면 1회 조회)에서
     정확한 run_id로만 찾는다. 폴링마다 외부(GitHub)를 찌르지 않는다. */
  const settleByRun = {};
  {
    const candRepos = [...new Set(latestList.filter(r => {
      const steps = Object.values(r.steps || {});
      return steps.length && steps.every(v => v.status === "done");
    }).map(r => r.repo).filter(Boolean))];
    for (const name of candRepos) {
      let st = schedCache[name];
      if (!st) {
        try { st = await jget("/api/sched?repo=" + encodeURIComponent(name)); schedCache[name] = st; }
        catch (e) { st = null; }
      }
      (st && st.queue || []).forEach(it => {
        if (isSupersededItem(it) && supersededNoteIsNoChange(it.note) && it.run_id)
          settleByRun[bareRunId(it.run_id)] = it;
      });
    }
  }
  const settledOf = r => settleByRun[bareRunId(r.id)] || null;
  const blockedRuns = latestList.filter(r => (r.waitReason || "").startsWith("question:"));
  const usedIds = new Set(blockedRuns.map(r => r.id));
  const reviewRuns = latestList.filter(r => {
    if (usedIds.has(r.id)) return false;
    /* 확정 판정(superseded-no-change)은 검토 결정이 아니다 */
    if (settledOf(r)) return false;
    const steps = Object.values(r.steps || {});
    return steps.length && steps.every(v => v.status === "done");
  });
  const resumeRuns = latestList.filter(r => {
    if (usedIds.has(r.id)) return false;
    /* 확정 중복(no-code)은 끝난 판정이라 이어하기 대상이 아니다 */
    if (isNoCodeDone((r || {}).outcome, (r || {}).waitReason)) return false;
    /* 외부 대기(확정 조건부 무변경)도 이어하기 대상이 아니다: 해제 조건이
       생겨야 같은 실행이 다시 평가 대상이 된다 */
    if (isExternalWatch((r || {}).outcome, (r || {}).waitReason)) return false;
    /* 확정 판정(superseded-no-change)도 이어하기 대상이 아니다 */
    if (settledOf(r)) return false;
    const steps = Object.values(r.steps || {});
    return !steps.length || (!steps.every(v => v.status === "done") &&
      !(r.waitReason || "").startsWith("question:") &&
      steps.some(v => v.status === "failed" || v.status === "blocked")) ||
      ((r.waitReason || "") && !(r.waitReason || "").startsWith("question:"));
  });
  /* 결정 필요는 한 곳에만: 답변 대기 + 리뷰(완료·미게시)를 각 1행씩.
     끝낸 일 카드를 따로 두어 같은 행을 두 번 보여주지 않는다. */
  const decisionRows = [];
  /* 막힌 일의 답변창은 여기 하나뿐이다: 같은 질문에 대한 거대 중복
     카드를 따로 두지 않고 결정 행 안에서 바로 답한다. */
  const qcardFor = r => {
    const bfull = (r.waitReason || "").slice("question:".length).trim();
    const bq = bfull.slice(0, 140);
    const blink = ghIssueUrl(r.repo, r.issue);
    const hh = homeRunHead(r);
    return `<div class="qcard"><div class="qtext"><b title="${esc(hh.tip)}">${esc(hh.primary)}</b> ` +
      `<span class="muted small">${esc(hh.secondary)}</span><br>${esc(bq)}${bfull.length > 140 ? "…" : ""}` +
      (blink ? ` <a class="alink" href="${blink}" target="_blank" rel="noopener">이슈 ↗</a>` : "") +
      (bfull.length > 140 ? `<details data-dk="q-${esc(r.id)}"><summary>질문 전문 보기</summary><div class="small">${esc(bfull)}</div></details>` : "") + `</div>` +
      `<div class="qrow"><input type="text" id="ans-${r.id}" data-ans="${esc(r.id)}" placeholder="답변을 입력하세요" aria-label="${esc(hh.primary)} 답변">` +
      `<button class="btn sm hot" data-answer="${r.id}">보내기</button></div>` +
      `<div class="inline-err" id="ans-err-${r.id}" role="status" hidden></div></div>`;
  };
  blockedRuns.slice(0, 8).forEach(r => {
    decisionRows.push(qcardFor(r));
    usedIds.add(r.id);
  });
  if (blockedRuns.length > 8) {
    const rest = blockedRuns.slice(8);
    rest.forEach(r => usedIds.add(r.id));
    decisionRows.push(`<details data-dk="q-rest"><summary>나머지 ${rest.length}건 보기</summary>` +
      rest.map(qcardFor).join("") + `</details>`);
  }
  /* 완료된 검토는 결정이 아니다: 결정 카드에서 빼고 게시 전 목록으로 따로 둔다. */
  const unpublishedCard = reviewRuns.length ? `<div class="card"><h2>완료된 독립 검토 ${reviewRuns.length}건</h2>` +
    `<div class="muted small">지난 독립 검토 기록입니다. 이것만으로 전체가 끝난 것은 아니며, 검증 상태는 각 기록에서 따로 봅니다.</div>` +
    reviewRuns.slice(0, 5).map(r => {
      const hh = homeRunHead(r);
      return `<div class="actionrow"><span class="q"><b title="${esc(hh.tip)}">${esc(hh.primary)}</b> ` +
        `<span class="muted small">${esc(hh.secondary)}</span> ` +
        `<span class="qchip">완료</span> <span class="qchip">미게시</span></span>` +
        `<a class="btn sm" href="#/repo/${encodeURIComponent(r.repo || "")}?tab=reviews">검토 작업실</a></div>`;
    }).join("") + `</div>` : "";
  reviewRuns.forEach(r => usedIds.add(r.id));
  resumeRuns.filter(r => !usedIds.has(r.id)).slice(0, 2).forEach(r => {
    const hh = homeRunHead(r);
    decisionRows.push(`<div class="actionrow"><span class="q"><b title="${esc(hh.tip)}">${esc(hh.primary)}</b> ` +
      `<span class="muted small">${esc(hh.secondary)}</span> ` +
      `<span class="qchip">${esc(runOutcomeWord(r, (O.jobs || [])))}</span></span>` +
      `<button class="btn sm" data-actwork="${r.id}">이어하기</button></div>`);
    usedIds.add(r.id);
  });
  const decisionCard = `<div class="card"><h2>답변이 필요한 일</h2>` +
    (decisionRows.join("") || `<div class="muted">결정 대기 없음</div>`) + `</div>`;
  /* 확정 판정은 결정이 아니라 끝난 기록이다: 원래 제목 그대로,
     '변경 불필요 · 이미 반영됨' + 접힌 실제 사유 + 기록 열기(읽기 전용).
     리뷰 결정 수에 세지 않는다. */
  const settledList = latestList.filter(r => !usedIds.has(r.id) && settledOf(r));
  settledList.forEach(r => usedIds.add(r.id));
  const settledCard = settledList.length ? `<div class="card"><h2><span class="cap">변경 불필요</span>이미 반영됨 · 결정 아님</h2>` +
    settledList.map(r => {
      const hh = homeRunHead(r);
      const stl = settledOf(r);
      return `<div class="actionrow"><span class="q"><b title="${esc(hh.tip)}">${esc(hh.primary)}</b> ` +
        `<span class="muted small">${esc(hh.secondary)}</span> ` +
        `<span class="qchip">변경 불필요</span> <span class="qchip">이미 반영됨</span>` +
        `<details class="provnote"><summary>판정 사유 보기</summary><div class="muted small">${esc(stl.note || "")}` +
        (stl.run_id ? ` · 실행 ${esc(bareRunId(stl.run_id))}` : "") + `</div></details></span>` +
        `<button class="btn sm" data-actwork="${r.id}">기록 열기</button></div>`;
    }).join("") + `</div>` : "";
  /* 최근 결과는 결정 카드에 나온 행을 제외하고 작게 나열한다. 완료는 로컬 검증·초안
     기준이며 병합·게시는 승인 후 별도 단계다. */
  const outcomeList = latestList.filter(r => !usedIds.has(r.id) &&
    !(Object.values(r.steps || {}).some(v => v.status === "running"))).slice(0, 5);
  const outcomeCard = outcomeList.length ? `<div class="card"><h2><span class="cap">최근 결과</span>진행·결정 제외</h2>` +
    outcomeList.map(r => {
      const hh = homeRunHead(r);
      return `<div class="actionrow"><span class="q"><b title="${esc(hh.tip)}">${esc(hh.primary)}</b> ` +
        `<span class="muted small">${esc(hh.secondary)}</span> ` +
        `<span class="qchip">${esc(runOutcomeWord(r, (O.jobs || [])))}</span>` +
        `${r.created_at ? ` <span class="muted small">${fmtKSThm(r.created_at)}</span>` : ""}</span>` +
        `<button class="btn sm" data-actwork="${r.id}">열기</button></div>`;
    }).join("") + `</div>` : "";
  const cards = repos.map(r => {
    const live = (O.runs || []).find(x => x.repo === r.name &&
      Object.values(x.steps || {}).some(v => v.status === "running"));
    const c = r.queue_counts || {};
    const scanned = !!r.last_scan;
    const repoLatest = latestList.filter(x => x.repo === r.name);
    const driftN = (r.drift || "").startsWith("DRIFT") ? (r.drift.split(":")[1] || "").split(",").filter(x => x.trim()).length : 0;
    const driftTxt = !scanned ? "알 수 없음(스캔 전)"
      : (r.drift || "").startsWith("DRIFT") ? `드리프트 ${driftN}건`
      : (r.drift || "").startsWith("ok (") ? "정상" : driftKo(r.drift);
    const nowLive = live ? homeRunHead(live) : null;
    const now = nowLive ? `${nowLive.primary}(${nowLive.secondary}) 진행 중`
      : (r.current_job ? `작업 ${(r.current_job.id || "")} 진행 중` : "실행 중인 작업 없음");
    let lastOut;
    if (r.last_outcome) {
      const rawRes = String(r.last_outcome.result || "완료");
      lastOut = `${STATUS_KO[rawRes] || GST_KO[rawRes] || resultKo(rawRes)} · ${r.last_outcome.at ? fmtKSThm(r.last_outcome.at) : ""}`;
    }
    else if (repoLatest.length) {
      const lr = repoLatest.sort((a, b) => (b.created_at || "") < (a.created_at || "") ? -1 : 1)[0];
      const lh = homeRunHead(lr);
      lastOut = `${lh.secondary || ("#" + (lr.issue || ""))} ${runOutcomeWord(lr, (O.jobs || []))}${lr.created_at ? " · " + fmtKSThm(lr.created_at) : ""}`;
    }
    else lastOut = scanned ? "스캔됨 · 실행 기록 없음" : "스캔 안 함 · 알 수 없음";
    const primary = (!scanned ? ["지금 스캔", "scan"]
      : c.blocked ? ["차단 검토", "blocked"]
      : (c["waiting-review"] ? ["검토 작업실", "review"]
      : (!r.sched_enabled ? ["자동 시작", "enable"] : ["지금 스캔", "scan"])));
    /* 파생 검토 전망(유지된 묶음 기준)이 1차, 원시 큐 카운트는 내역으로만 둔다. */
    const rb2 = ((O.review_batches || {})[r.name]) || {};
    const rbLine = (rb2.unique || rb2.reviewed || rb2.ready)
      ? `<div class="kvline"><span class="k">검토 묶음</span><span>1차 검토 완료 ${rb2.reviewed || 0} · 검증 중 ${rb2.validating || 0} · 막힘 ${rb2.failed || 0} · 검증 완료 ${rb2.ready || 0}` +
        (rb2.next_action ? ` · 다음: ${esc(rb2.next_action)}` : "") + `</span></div>`
      : "";
    const stateLead = scanned ? driftTxt : "스캔 전";
    const gridRows = `<span class="k">자동 실행</span><span>${r.execute_enabled ? "켬" : "끔"}</span>` +
      `<span class="k">지금</span><span>${esc(now)}</span>` +
      `<span class="k">다음 분기</span><span title="${nextProv(r)}">${esc(nextLabel(r.has_next))}</span>` +
      `<span class="k">다음 스캔</span><span>${r.next_scan ? fmtKSThm(r.next_scan) : "미정"}</span>` +
      (((r.scan_freshness || {}).state === "delayed-processing" || (r.scan_freshness || {}).state === "delayed-check")
        ? `<span class="k">스캔 상태</span><span>${esc((r.scan_freshness || {}).detail || "지연")}</span>` : "");
    return `<div class="repocard card"><h2 style="margin:0">${esc(r.name)} ` +
      `<span class="muted small">${esc(r.github || "")}</span></h2>` +
      `<div class="repocard-state">${esc(stateLead)}</div>` +
      `<div class="kvgrid">${gridRows}</div>` + rbLine +
      `<details data-dk="rawq-${esc(r.name)}"><summary>자동 처리 기록 (참고용)</summary>` +
      `<div class="kvline"><span class="k">마지막 자동 결과</span><span>${esc(lastOut)}${r.sched_error ? " · 오류: " + esc(errKo(r.sched_error).slice(0, 60)) : ""}</span></div>` +
      `<div class="statline">${qc(c, "queued", "대기")}${qc(c, "running", "진행")}` +
      `${qc(c, "blocked", "차단")}${qc(c, "waiting-review", "리뷰 대기")}${(c.deferred ? qc(c, "deferred", "외부 대기") : "")}</div></details>` +
      `<div class="btnrow"><button class="btn sm hot" data-primary="${esc(r.name)}" data-act="${primary[1]}">${primary[0]}</button>` +
      `<button class="btn sm" data-exec="${esc(r.name)}" data-on="${r.execute_enabled ? 1 : 0}" title="끄면 스캔만 하고 자동 실행은 하지 않습니다">자동 실행 ${r.execute_enabled ? "끄기" : "켜기"}</button>` +
      `<button class="btn sm quiet" data-open="${esc(r.name)}">자세히</button>` +
      `<span class="iconmenu"><button class="btn sm quiet" data-menu="${esc(r.name)}" aria-haspopup="menu">더 보기</button></span></div>` +
      `<div id="q-${esc(r.name)}"></div></div>`;
  }).join("");
  const svc = O.maintenance_service || {};
  const lock = O.worker_lock;
  /* 워커 표시 게이트: 명시적 live 증거가 있을 때만 실행 중으로 말한다.
     소유자 메타만으로는 실행 중이라 말하지 않고, probe 실패(None)면
     알 수 없음으로 말한다. live이나 소유자 미상이면 주체 미상으로 말한다. */
  const lockWord = workerLockWord(lock);
  /* 서비스 줄의 워커 표기는 일반 상태만: 원시 owner/pid는 아래 워커 줄의
     툴팁(기술 정보)으로만 둔다. */
  const svcWorkerTxt = lockWord === "live-owner" ? " · 워커 잠금 중"
    : lockWord === "live-unknown" ? " · 워커 잠금 중(주체 미상)"
    : lockWord === "idle" ? " · 워커 유휴" : " · 워커 상태 알 수 없음";
  const svcTxt = svc.installed == null && !svc.note ? "서비스 상태 알 수 없음"
    : svc.installed ? `서비스 설치됨${svcWorkerTxt}` : "서비스 미설치 · 요청 시에만 동작";
  /* 첫 화면 요약: 실제 모드(스캔 전용 vs 자동 실행) · 마지막/다음 스캔 · 워커 상태 */
  const autoOn = repos.filter(r => r.execute_enabled);
  const modeTxt = autoOn.length ? `자동 실행 켬 ${autoOn.length}곳(${autoOn.map(r => r.name).join(", ")})` : "스캔 전용(자동 실행 전체 끔)";
  const lastScanTxt = repos.map(r => r.last_scan).filter(Boolean).sort().pop();
  const nextScanTxt = repos.map(r => r.next_scan).filter(Boolean).sort()[0];
  const liveRun = (O.runs || []).find(x => Object.values(x.steps || {}).some(v => v.status === "running"));
  const runningJob = (O.jobs || []).find(j => j.status === "running");
  const workerHead = liveRun ? homeRunHead(liveRun) : null;
  /* 사람용 목적이 있으면 목적을, 원시 owner/pid는 툴팁 기술 정보로만 둔다. */
  const workerH = workerHeadline(lock, lockWord, workerHead,
    runningJob ? runningJob.label : "");
  const workerTxt = workerH.text;
  const workerTip = workerH.tip;
  const delayedRepos = repos.filter(r => {
    const f = (r.scan_freshness || {}).state || "";
    return f === "delayed-processing" || f === "delayed-check";
  });
  const delayTxt = delayedRepos.length
    ? `<div class="cmd-note">스캔 지연 ${delayedRepos.length}곳(${delayedRepos.map(r => esc(r.name)).join(", ")}) — ${esc((delayedRepos[0].scan_freshness || {}).detail || "서비스 확인 필요")}</div>` : "";
  const svcVal = (svc.installed == null && !svc.note) ? "알 수 없음"
    : svc.installed ? "설치됨" : "미설치(요청 시에만 동작)";
  const workerVal = workerTip
    ? `<span title="${esc(workerTip)}">${esc(workerTxt.replace(/^워커 /, ""))}</span>`
    : esc(workerTxt.replace(/^워커 /, ""));
  const statusLine = `<div class="cmdline" role="group" aria-label="관제 현황">` +
    `<span class="cmd-f"><span class="k">서비스</span><span>${esc(svcVal)}</span></span>` +
    `<span class="cmd-f"><span class="k">모드</span><span>${esc(modeTxt)}</span></span>` +
    `<span class="cmd-f"><span class="k">마지막 스캔</span><span>${lastScanTxt ? fmtKSThm(lastScanTxt) + " (" + ago(lastScanTxt) + " 전)" : "아직 스캔 안 함"}</span></span>` +
    `<span class="cmd-f"><span class="k">다음 스캔</span><span>${nextScanTxt ? fmtKSThm(nextScanTxt) : "미정"}</span></span>` +
    `<span class="cmd-f"><span class="k">워커</span><span>${workerVal}</span></span></div>` +
    `<div class="cmd-note">모든 시각 KST</div>${delayTxt}`;
  $("view").innerHTML = `<div class="col"><div class="pagehead"><h1>관제센터</h1>` +
    `<div class="sub">${statusLine}</div></div>` +
    `<div class="cmdgrid">${cards}</div>` + decisionCard + unpublishedCard + settledCard + outcomeCard +
    `<div class="card"><h2><span class="cap">최근 사건</span>무슨 일이 있었나</h2><div id="evlist"><div class="skel"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div></div></div></div>`;
  focusViewHeading();
  document.querySelectorAll("[data-actwork]").forEach(b => b.onclick = () => openWork(b.dataset.actwork));
  const sendCmdAnswer = async btn => {
    const inp = $("ans-" + btn.dataset.answer);
    const a = ((inp && inp.value) || "").trim();
    if (!a) { if (inp) inp.focus(); return; }
    answerInlineHide("ans-err-" + btn.dataset.answer);
    btn.disabled = true;
    try { const r = await jpost("/api/job/answer", {run: btn.dataset.answer, answer: a});
      await handleAnswerOk(r); }
    catch (e) { handleAnswerError(e, btn); }
  };
  document.querySelectorAll("[data-answer]").forEach(b => {
    b.onclick = () => sendCmdAnswer(b);
    const inp = $("ans-" + b.dataset.answer);
    if (inp) inp.addEventListener("keydown", e => {
      if (e.key === "Enter") sendCmdAnswer(b);
    });
    /* F2b: 다음 편집이면 인라인 오류도 치운다. */
    if (inp) inp.addEventListener("input", () => answerInlineHide("ans-err-" + b.dataset.answer));
  });
  document.querySelectorAll("[data-exec]").forEach(b => b.onclick = async () => {
    const turningOn = b.dataset.on !== "1";
    b.disabled = true;

  const repBc = rep ? rep.build_contract : undefined;
  const repBcDecl = (repBc && typeof repBc === "object" && repBc.declaration && typeof repBc.declaration === "object")

  if (staleKeptFull) {

  const ctxList = Array.isArray(st.contexts) ? st.contexts : [];
  /* 보충 맥락 건수는 저장된 운용자 메모의 개수일 뿐, 소유자 정책

  const ctxQs = (rep && Array.isArray(rep.questions)) ? rep.questions : null;
  const ctxShowForm = st.context_allowed === true

    /* 격리 점검 패널: 읽기 전용 증거다. 서버 게이트의 현재 상태를

  const inputPanelKey = (sel) => `${opId}/${sel.dfix}/${sel.att}`;
  const inputCloseBtn = `<div class="btnrow" style="margin-top:6px"><button class="btn sm" id="dfix-input-close" data-dfix-input-close="1" style="min-height:44px">입력 보기 닫기</button></div>`;
  /* 패널 열림: 로딩 단계의 강제 열림(명시적 클릭 1회) > 현재 DOM

     기본 열림이다. 강제 열림은 로딩 커밋에만 쓰고 곧바로 소모한다:

     칸도 닫힌 채로 남는다. */
  const panelOpenFor = (sel, fresh, forLoading) => {
    const key = inputPanelKey(sel);
    if (forLoading && forceKey && forceKey === key) return true;

      const cur = readPanel();
      if (cur && cur.key === key) return cur.open;

    if (prevPanel && prevPanel.key === key) return !!prevPanel.open;

  const loadingPanel = (sel) => `<details class="provnote" data-dfix-input-panel data-input-key="${esc(inputPanelKey(sel))}"${panelOpenFor(sel, true, true) ? " open" : ""}><summary id="dfix-input-panel-summary" style="min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600" tabindex="0">전체 전송 입력 — 읽는 중</summary><div class="ev small" role="status" aria-busy="true">보관 입력을 읽는 중…</div>${inputCloseBtn}</details>`;

  const inputPanelFor = (iv, ivErr, ivCode, sel) => {

    const openAttr = panelOpenFor(sel, true, false) ? " open" : "";
    const keyAttr = ` data-input-key="${esc(inputPanelKey(sel))}"`;
    const openTag = (title) => `<details class="provnote" data-dfix-input-panel${keyAttr}${openAttr}><summary id="dfix-input-panel-summary" style="min-height:44px;display:flex;align-items:center;" tabindex="0">${title}</summary>`;
    if (ivErr || !iv || typeof iv !== "object") {

      }

          `<div class="ev small">사유: ${esc(ivErr || "보관된 입력을 검증하지 못했다")}</div>` +
          `<div class="ev small muted">깨진 보관분은 성공으로 표시하지 않는다. 원본 기록은 그대로 둔다.</div>` + closeBtn + `</details>`;
      }
      return openTag("전체 전송 입력 — 조회 실패") +
        `<div class="ev small">사유: ${esc(ivErr || "알 수 없는 응답")}</div>` +
        `<div class="ev small muted">화면을 다시 읽으면 보관 입력을 다시 조회합니다. 모델을 다시 실행하지 않습니다.</div>` + closeBtn + `</details>`;

    }
    if (iv.status === "not-yet-dispatched") {
      return openTag("전체 전송 입력 — 미전송") +
        `<div class="ev small muted">아직 전송되지 않았다(대기 중). 전송 뒤에 다시 열면 전체 내용을 볼 수 있다.</div>` + closeBtn + `</details>`;
    }
    if (iv.status === "pre-input-failure") {
      return openTag("전체 전송 입력 — 전송 전 실패") +
        `<div class="ev small">사유: ${esc(iv.error || "전송 전에 실패했다")}</div>` + closeBtn + `</details>`;
    }
    if (iv.status === "missing-required") {
      return openTag("전체 전송 입력 — 보관분실") +
        `<div class="ev small">기록된 입력이 보관소에서 사라졌다. 원본 기록은 그대로 두며, 새로 만들지 않는다.</div>` + closeBtn + `</details>`;
    }
    if (iv.status !== "stored") {
      return openTag("전체 전송 입력 — 검증 실패") +
        `<div class="ev small">사유: ${esc((iv && iv.error) || ivErr || "보관된 입력을 검증하지 못했다")}</div>` + closeBtn + `</details>`;
    }
    const prof = (iv.profile && typeof iv.profile === "object") ? iv.profile : {};
    const refs = (iv.source_refs && typeof iv.source_refs === "object") ? iv.source_refs : {};
    const omitted = Array.isArray(iv.omitted) ? iv.omitted : [];
    const omitLabel = (r) => r === "absent-at-ref" ? "고정 참조에 없음(확인됨)" : r === "blob-over-file-cap" ? "크기 초과로 내용 미전송" : r === "over-global-budget" ? "전체 한도로 축소 전송" : ("사유: " + (r || "?"));
    const isPartialRow = (o) => !!o && o.reason === "over-global-budget" && typeof o.sent_bytes === "number" && o.sent_bytes > 0;
    const fullOut = omitted.filter(o => !isPartialRow(o));
    const partialRows = omitted.filter(o => isPartialRow(o));
    const omitHead = (fullOut.length && partialRows.length) ? `미전송 ${fullOut.length}건 · 부분 전송 ${partialRows.length}건`
      : fullOut.length ? `미전송 ${fullOut.length}건`
      : partialRows.length ? `부분 전송 ${partialRows.length}건` : "";
    const qs = (iv.questions && typeof iv.questions === "object") ? iv.questions : {};
    const clippedNote = (typeof qs.clipped === "number" && qs.clipped > 0) ? ` (그 중 ${qs.clipped}건 잘림 · ${typeof qs.clipped_bytes === "number" ? qs.clipped_bytes : "?"}바이트 생략)` : "";
    return openTag("전체 전송 입력 — 저장됨") +
      `<div class="ev small">SHA <span class="mono">${esc(iv.prompt_sha256 || "?")}</span> · <span class="mono">${esc(String(iv.prompt_bytes == null ? "?" : iv.prompt_bytes))}B</span> · 핀 <span class="mono">${esc(iv.pin_sha256 || "?")}</span></div>` +
      `<div class="ev small muted">원본 후보 <span class="mono">${esc(refs.candidate_head || "?")}</span> · 베이스 <span class="mono">${esc(refs.base_head || "?")}</span> · 준비 <span class="mono">${esc(refs.prep_head || "?")}</span> · 트리 <span class="mono">${esc(refs.prep_tree || "?")}</span></div>` +
      `<div class="ev small muted">호출 인자(요청됨 — 실제 호출 미검증): 모델 <span class="mono">${esc(prof.model == null ? "지정 안 함(muse.py 기본값 적용, 미검증)" : prof.model)}</span> · 기여자 <span class="mono">${esc(prof.contributor || "?")}</span> · 구독 <span class="mono">${esc(prof.subscription || "?")}</span> · 제한시간 <span class="mono">${esc(String(prof.timeout_s == null ? "?" : prof.timeout_s))}초</span></div>` +
      `<div class="ev small muted">바이너리 <span class="mono">${esc(prof.binary_sha256 || "?")}</span> · 도구집합 <span class="mono">${esc(prof.toolset_doc_sha256 || "?")}</span> · 용량 <span class="mono">${esc(prof.capacity || "?")}</span> — 실제 실행 환경 미검증</div>` +
      (omitHead ? `<div class="ev small">${omitHead}: ` + omitted.map(o => `<span class="mono">${esc((o && o.path) || "?")}</span><span class="ev small muted">[${esc((o && o.ref_kind) || "?")} · ${esc(omitLabel(o && o.reason))} · ${isPartialRow(o) ? `${o.sent_bytes}B 전송됨(일부)` : "코드 미전송"}]</span>`).join(" ") + `</div>` : `<div class="ev small muted">미전송 없음</div>`) +
      `<div class="ev small">질문 ${esc(String(qs.sent == null ? "?" : qs.sent))}/${esc(String(qs.total == null ? "?" : qs.total))}건 전송${esc(clippedNote)}</div>` +
      `<div class="ev small mono" style="white-space:pre-wrap;word-break:break-word;max-width:100%;">${esc(iv.text == null ? "" : iv.text)}</div>` +
      `<div class="ev small muted">이 텍스트가 앱이 보낸 전체 입력이다. 모델 내부 문맥·실제 CLI 호출은 포함하지 않는다.</div>` + closeBtn + `</details>`;
  };
  const inputSel = (box._dFixInputSel && typeof box._dFixInputSel === "object") ? box._dFixInputSel : null;
  if (inputSel && inputSel.dfix && inputSel.att) {
    /* 1단계: 로딩 커밋을 먼저 보여준다. 열리는 동안 같은 버튼은
       비활성화되며, 패널은 role=status + aria-busy로 읽는 중임을
       알린다. 여기서는 보관 파일을 읽지 않는다. */

    commit(renderAll(loadingPanel(inputSel)));
    /* 로딩 DOM을 즉시 묶는다: 느리거나 멈춘 조회 중에도 닫기·시도
       전환·취소·제출 버튼이 동작한다. 닫기는 선택만 비우고 모델
       작업을 건드리지 않는다. 강제 열림은 로딩 커밋에 썼으므로
       여기서 소모한다: 최종 칸은 현재 DOM 토글을 그대로 따른다. */
    wireControls();
    forceKey = null;
    if (!own()) return;
    let iv = null, ivErr = "", ivCode = "";
    try {
      iv = await jget("/api/integration/derived-fix/input?op=" + encodeURIComponent(opId) +
        "&dfix=" + encodeURIComponent(inputSel.dfix) + "&attempt=" + encodeURIComponent(inputSel.att));
    } catch (eV) { ivErr = (eV && eV.message) || "조회 실패"; ivCode = (eV && eV.code) || ""; }

  } else {

  }
  /* 로딩 단계 DOM도 그리는 즉시 묶는다: phase-1 커밋 뒤 대기 중에

  function wireControls() {
  const say2 = (t) => { const m = $("prep-derivedfix-msg"); if (m) m.textContent = t || ""; };
  /* 파생 수정 시작: 명시적 확인 뒤 한 번만 POST. 동기 잠금

  const submitDerive = async (goBtn, retryOf) => {
    if (box._dFixSubmitting) return;
    box._dFixSubmitting = true;
    if (goBtn) goBtn.disabled = true;
    try {
      if (!own()) return;
      const ta = $("prep-dfix-note");
      const hyp = box.querySelector ? box.querySelector("input[name='prep-dfix-hyp']:checked") : null;
      if (!ta) return;
      const text = typeof ta.value === "string" ? ta.value : "";
      if (!text.trim()) {
        say2("운용자 가설 메모가 비어 있습니다. 기술 가설을 입력하세요.");

      }
      const hid = (hyp && hyp.value === "H-B") ? "H-B" : "H-A";

      let fresh;

      } catch (e3) {

      const fShas = (fresh && fresh.origin_shas) || null;

        && fShas.input_sha256 === shas.input_sha256 && fShas.report_sha256 === shas.report_sha256;

        box._dFixMoved = {oldInput: org.input, oldReport: org.report,
          oldIn: shas.input_sha256, oldRep: shas.report_sha256,
          note: text, hyp: hid};

      if (!own()) return;
      const r = await jpost("/api/integration/derived-fix/start",
        Object.assign({op: opId, confirm: true,
         hypothesis: {id: hid, note: text},
         context: {input: org.input, report: org.report,
                   expected: {input_sha256: shas.input_sha256, report_sha256: shas.report_sha256}}},
          retryOf ? {retry_of: retryOf} : null));
      if (!own()) return;
      const isBool = (v) => typeof v === "boolean";
      const nonEmptyStr = (v) => typeof v === "string" && !!v;
      const okShape = r && typeof r === "object"
        && isBool(r.started) && isBool(r.reused) && isBool(r.attached)
        && typeof r.op === "string" && r.op === opId
        && nonEmptyStr(r.dfix);
      const okStart = okShape
        && r.started === true && r.reused === false && r.attached === false
        && nonEmptyStr(r.attempt)
        && r.job && typeof r.job === "object"
        && nonEmptyStr(r.job.id);
      const okReuse = okShape
        && r.started === false && r.reused === true && r.attached === false;
      const okAttach = okShape
        && r.started === false && r.reused === true && r.attached === true
        && r.job && typeof r.job === "object" && nonEmptyStr(r.job.id);
      /* 실행 중 감시: 먼저 즉시 다시 그려 소유 실행·취소 버튼을
         보여주고(폼은 살아 있는 기록 때문에 숨는다) 시작한 뒤,
         세대 가드로 끝까지 폴링한다. 시작·연결 모두 같은 경로를
         쓴다. */
      const watchLive = async (verb) => {
        box._dFixClear = true;
        box._dFixRetry = null;
        say2(verb);
        if (typeof pollJob === "function" && r.job && r.job.id) {
          try { pollJob(r.job.id); } catch (eP) { /* 폴링 실패는 tick이 잇는다 */ }
        }

        const here = () => box.isConnected !== false
          && box.dataset.dFixOp === opId
          && box.dataset.dFixSeq === mySeq;

        const tick = async () => {
          if (!here()) return;
          if (n++ > 120) return;
          let s2;

            s2 = await jget("/api/integration/derived-fix?op=" + encodeURIComponent(opId));
          } catch (e4) { setTimeout(tick, 5000); return; }
          const live2 = (s2 && Array.isArray(s2.derived) ? s2.derived : []).some(
            d => d && (d.status === "started" || d.status === "source-running" || d.status === "queued"));

            if (!here()) return;

              await paintDerivedFixSection(box, prep);
            } catch (e5) {

  const s0 = (w.state || {});

  const watchRec = (w.outcome || {}).watch && (w.outcome || {}).watch.active ? (w.outcome || {}).watch

    w = cv.getBoundingClientRect().width || 0;

  const stack = (mainW > 0 && mainW < 1000) || (mainW === 0 && w > 0 && w < 560);
  lay.classList.toggle("gstack", stack);

  else if (gStackLast !== stack) { gStackLast = stack; gLayoutGen++; }

function applyZoom() {

}
function graphZoom(f) {
  if (!gFit || !gVB) return;
  const cx = gVB.x + gVB.w / 2, cy = gVB.y + gVB.h / 2;
  let w = gVB.w / f, h = gVB.h / f;
  w = Math.min(gFit.w * 4, Math.max(gFit.w / 6, w));
  h = Math.min(gFit.h * 4, Math.max(gFit.h / 6, h));
  gVB = {x: cx - w / 2, y: cy - h / 2, w, h};
  applyZoom();
}
function bindPan() {
  const svg = $("gsvg");
  if (!svg) return;

  const scale = () => {
    const r = svg.getBoundingClientRect ? svg.getBoundingClientRect() : {width: 600};
    return gVB.w / Math.max(1, r.width || 600);
  };
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-gid]")) return;
    gDragging = true; sx = e.clientX; sy = e.clientY; ox = gVB.x; oy = gVB.y;
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener("pointermove", e => {
    if (!gDragging) return;
    const k = scale();
    gVB.x = ox - (e.clientX - sx) * k; gVB.y = oy - (e.clientY - sy) * k;
    applyZoom();
  });
  ["pointerup", "pointercancel"].forEach(t => svg.addEventListener(t, () => { gDragging = false; }));

    e.preventDefault();

/* 저장소 빠른 전환은 ⌘K 팔레트가 맡는다. fuzzy/hlHtml은 팔레트에서 쓴다. */
function mdInline(s) {
  /* 인라인 코드 정규식은 문자열 형태로 둔다: 리터럴 속 백틱 3개가
     홀수라 테스트 추출기의 따옴표 추적을 깨뜨리기 때문이다. 의미는 같다. */
  return s.replace(new RegExp("`([^`\n]+)`", "g"), "<code class=\"inl\">$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(workfile:([^)\s]+)\)/g,
      "<button class=\"linkbtn\" data-reportfile=\"$2\">$1</button>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      "<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1</a>");

/* GFM 파이프 표 판정: 머리행 + 구분행 + 1개 이상 본문행이 연속되고
   모든 행의 칸 수가 같을 때만 표다. 구분행이 없거나 칸 수가 어긋나면
   원래 글자 그대로 둔다(실패 안전). */
function splitPipeRow(line) {
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|")) t = t.slice(0, -1);
  return t.split("|").map(c => c.trim());
}
function isPipeDelim(line) {
  const cells = splitPipeRow(line);
  return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));
}
function md(src) {
  const lines = esc(src).split("\n");
  let out = "", para = [], list = null, fence = null;
  const flushPara = () => {
    if (para.length) { out += `<p>${mdInline(para.join("<br>"))}</p>`; para = []; }
  };
  const flushList = () => {
    if (list) {
      const tag = list.ordered ? "ol" : "ul";
      out += `<${tag}>` + list.items.map(i => `<li>${mdInline(i)}</li>`).join("") + `</${tag}>`;
      list = null;
    }
  };
  /* 코드펜스 정규식도 문자열 형태로 둔다(mdInline 주석과 같은 이유). 루프 밖에서 한 번만 만든다. */
  const fenceRe = new RegExp("^```(\\S*)\\s*$");
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    if (fence === null && line.includes("|")) {
      const head = splitPipeRow(line);
      const dl = lines[li + 1];
      if (dl !== undefined && isPipeDelim(dl) && splitPipeRow(dl).length === head.length) {
        const rows = [];
        let lj = li + 2;
        while (lj < lines.length && lines[lj].includes("|") &&
          splitPipeRow(lines[lj]).length === head.length) {
          rows.push(splitPipeRow(lines[lj])); lj++;
        }
        if (rows.length) {
          flushPara(); flushList();
          out += `<div class="tblwrap"><table><tr>` +
            head.map(h => `<th>${mdInline(h)}</th>`).join("") + `</tr>` +
            rows.map(r => `<tr>` + r.map(c => `<td>${mdInline(c)}</td>`).join("") + `</tr>`).join("") +
            `</table></div>`;
          li = lj - 1;
          continue;
        }
      }
    }
    const f = line.match(fenceRe);
    if (f) {
      if (fence === null) { flushPara(); flushList(); fence = []; }
      else { out += `<pre class="code"><button class="copybtn" data-cb>복사</button><code>${fence.join("\n")}</code></pre>`; fence = null; }
      continue;
    }
    if (fence !== null) { fence.push(line); continue; }
    if (/^\s*$/.test(line)) { flushPara(); flushList(); continue; }
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { flushPara(); flushList(); out += `<h4>${mdInline(m[1])}</h4>`; continue; }
    if (/^---+$/.test(line.trim())) { flushPara(); flushList(); out += "<hr>"; continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); flushList(); out += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    if ((m = line.match(/^[-*]\s+(.*)$/))) { flushPara(); if (!list || list.ordered) { flushList(); list = {ordered: false, items: []}; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || !list.ordered) { flushList(); list = {ordered: true, items: []}; } list.items.push(m[1]); continue; }
    flushList();
    para.push(line);
  }
  if (fence !== null) { out += `<pre class="code"><button class="copybtn" data-cb>복사</button><code>${fence.join("\n")}</code></pre>`; }
  flushPara(); flushList();
  return out;
}

/* 본문 속 bare #123 참조를 의미 있는 링크로 바꾼다. 이미 링크·코드 안의
   것은 건드리지 않으며, 저장소 slug를 모르면 만들지 않는다(위조 금지). */
function linkifyIssueRefs(root, slug) {
  if (!root || !slug || typeof document === "undefined") return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(t => {
    if (!/#\d/.test(t.nodeValue || "")) return;
    const p = t.parentElement;
    if (!p || p.closest("a,code,pre")) return;
    const src = t.nodeValue;
    const frag = document.createDocumentFragment();
    const re = /#(\d{2,})(?![0-9a-fA-F])/g;
    let m, last = 0, hit = false;
    while ((m = re.exec(src))) {
      hit = true;
      frag.appendChild(document.createTextNode(src.slice(last, m.index)));
      const a = document.createElement("a");
      a.href = `https://github.com/${slug}/issues/${m[1]}`;
      a.target = "_blank"; a.rel = "noopener";
      a.title = `이슈 #${m[1]} 열기`;
      a.textContent = m[0];
      a.dataset.refnum = m[1];
      a.className = "reflink";
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (!hit) return;
    frag.appendChild(document.createTextNode(src.slice(last)));
    t.replaceWith(frag);
  });
}

/* PURE에 준함: 턴 1개 렌더. 복사 버튼은 원본 인덱스를 그대로 쓴다. */

    (t.role === "user" ? "" : `<button class="copybtn" data-copy="${i}">복사</button>`) + `</div>` +

/* 알려진 앱 단계 알림만: 사람·수동 메시지는 절대 해당하지 않는다. */
function isStageNotice(t) {
  if (!t || t.role !== "assistant") return false;
  return /^(?:\*\*(분류|재현|분석|수정|리뷰|검증|초안|알림)\*\*|유지보수 시작 — 실행)/.test(t.text || "");

/* 완료 실행의 연속 단계 알림(2건 이상)만 접힌 타임라인으로 묶는다.

  const runs = [];

    if (k && x.i === idx[k - 1].i + 1) cur.push(x);
    else { if (cur.length) runs.push(cur); cur = [x]; }
  });
  if (cur.length) runs.push(cur);
  const collapse = new Map();
  runs.forEach(r => { if (r.length >= 2) r.forEach(x => collapse.set(x.i, r)); });
  let out = "", k = 0;
  while (k < turns.length) {
    const r = collapse.get(k);
    if (!r) { out += turnHtml(turns[k], k); k++; continue; }
    const label = r.map(x => {
      const m = String(x.t.text || "").match(/^\*\*([^*]+)\*\*/);
      return m ? m[1] : "시작";
    }).join(" → ");
    out += `<details class="provnote"><summary>실행 타임라인 ${r.length}건 보기 (${esc(label)} · 원본 기록)</summary>` +
      r.map(x => turnHtml(x.t, x.i)).join("") + `</details>`;

let browse = {path: null, entries: [], parent: null, active: 0, is_git: false};
async function browseTo(path) {

    browse = {path: b.path, entries: (b.entries || []).filter(e => e.is_dir),
      parent: b.parent, active: 0, is_git: b.is_git};

function paintBrowse() {

    acc += "/" + s;
    const cur = acc === browse.path;
    return `<button class="crumb${cur ? " cur" : ""}" data-crumb="${esc(acc)}">${esc(s)}</button>`;
  }).join("");

    `${esc(e.name)}${e.is_git ? `<span class="git">git</span>` : ""}</button>`).join("") ||
    `<div class="muted small" style="padding:8px 12px">하위 폴더 없음</div>`;

/* U5: 추가 단추의 title은 활성 상태와 항상 동기화한다. 비활성이면

function openModalFocusTrap() {

/* 모델 상태 표기는 요청된 모드일 뿐이다: 실제 워커 연결·인증이
   검증된 적이 없으므로 초록불·정상 연결처럼 읽히지 않게 한다.
   billing 누락·오류는 알 수 없음으로 두며 API 키로 단정하지 않는다.
   Enter·Space는 네이티브 버튼 동작을 쓴다(별도 키 핸들러 없음). */
function modelPillState(s) {

  if (billing.indexOf("subscription") === 0) return {tone: "sub", html: dot + "미검증" + mut, label: plain + "구독 요청됨 · 미검증",
    title: (plain + "구독 요청됨 · 미검증. ") + "요청된 구독 로그인 모드입니다. 실제 워커 연결·인증은 검증되지 않았습니다."};
  if (billing.indexOf("api-key") === 0) return {tone: "key", html: dot + "API 키" + mut, label: plain + "API 키(설정됨)",
    title: (plain + "API 키(설정됨). ") + "API 키가 설정되어 있어 키 과금이 우선합니다. 저장된 키는 브라우저 로그인보다 우선합니다. 실제 워커 연결·인증은 검증되지 않았습니다."};
  return {tone: "unknown", html: dot + "상태 알 수 없음" + mut, label: plain + "상태 알 수 없음",
    title: (plain ? plain + "상태 알 수 없음. " : "") + "알 수 없는 과금 표시입니다. 실제 워커 연결·인증은 검증되지 않았습니다."};

function paintPill(st) {
